spring:
  application:
    name: five-networks-backend

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-binding-errors: always
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    root: INFO
    com.fivenetworks.site: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
