spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  storage:
    type: s3
    s3:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ROOT_USER}
      secret-key: ${MINIO_ROOT_PASSWORD}
      bucket: ${MINIO_BUCKET_PROD}
      region: us-east-1
