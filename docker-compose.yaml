services:
  postgres:
    image: postgres:16-alpine
    container_name: fn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-five_networks_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fn_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fn_app} -d ${POSTGRES_DB:-five_networks_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fn-postgres-data:
  
